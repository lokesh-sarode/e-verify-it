name: e-verify-it

x-app-env: &app-env
  NODE_ENV: ${NODE_ENV:-production}
  DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/email_verifier}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeThisStrongPassword}
  JWT_SECRET: ${JWT_SECRET:-change_this_secret_at_least_24_chars}
  COOKIE_SECRET: ${COOKIE_SECRET:-change_this_cookie_secret_24}
  REACHER_BASE_URL: ${REACHER_BASE_URL:-https://verify.example.com/v1}
  REACHER_API_KEY: ${REACHER_API_KEY:-}
  REACHER_BULK_RESULTS_PAGE_SIZE: ${REACHER_BULK_RESULTS_PAGE_SIZE:-500}
  REACHER_TIMEOUT_MS: ${REACHER_TIMEOUT_MS:-15000}
  VERIFICATION_CACHE_DAYS: ${VERIFICATION_CACHE_DAYS:-7}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
  API_PORT: ${API_PORT:-4000}

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-:80}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - api

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment: *app-env
    command: ["sh", "-c", "npm run prisma:migrate && node packages/backend/dist/seed.js && node apps/api/dist/index.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: email_verifier
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d email_verifier"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
